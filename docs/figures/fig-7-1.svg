<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" width="1000" height="486"><style>
@page { size: A4 landscape; margin: 13mm 13mm 12mm 13mm; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

:root {
  --paper: #FFFFFF;
  --tint: #F4F8F5;
  --tint2: #E6F4EC;
  --line: #DCE8E0;
  --ink: #12211A;
  --dim: #48654F;
  --faint: #75897D;
  --accent: #1E8E4E;
  --deep: #14663A;
  --warn: #96650C;
  --danger: #C0392B;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

html, body { margin: 0; padding: 0; }
body { font-family: var(--sans); font-size: 10pt; line-height: 1.5; color: var(--ink); background: var(--paper); }

@media screen {
  html { background: #d5d5d5; }
  body { padding: 18px 0; }
  body > section { width: 297mm; min-height: 210mm; margin: 0 auto 18px; background: #fff;
                   box-shadow: 0 4px 24px rgba(0,0,0,.18); padding: 13mm; overflow: hidden; }
}

.page { break-after: page; }
.page:last-child { break-after: auto; }
.cover { break-after: page; }

h2 { font-size: 15pt; margin: 0 0 1.5mm; letter-spacing: -0.4pt; font-weight: 700; }
p { margin: 0 0 2mm; }
p.lead { font-size: 10.5pt; color: var(--dim); line-height: 1.5; margin-bottom: 3mm; }
em { font-style: italic; }
strong { font-weight: 700; }
.mono { font-family: var(--mono); font-size: 0.94em; }

.dg { width: 100%; height: 118mm; display: block; margin: 1mm 0 2.5mm; }
.dg .bx { stroke-width: 1.4; }
.bx--ink  { fill: #FFFFFF; stroke: #B9D2C4; }
.bx--acc  { fill: var(--tint2); stroke: var(--accent); }
.bx--mut  { fill: var(--tint); stroke: var(--line); }
.bx--warn { fill: #FDF6E8; stroke: #D8A64B; }
.bx--bad  { fill: #FDECEA; stroke: #C0392B; }
.bx--chan { fill: #F1F8F4; stroke: #B9D2C4; stroke-dasharray: 5 3; }
.dg .ln { stroke: #5E7D68; stroke-width: 1.6; fill: none; }
.dg .lnacc { stroke: #1E8E4E; stroke-width: 1.8; fill: none; }
.dg .lnbad { stroke: #C0392B; stroke-width: 1.8; fill: none; }
.dg text { font-family: var(--sans); }
.t1 { font-size: 15px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 13px; font-weight: 600; fill: var(--ink); }
.t3 { font-size: 12px; fill: var(--dim); }
.t3c { font-size: 12px; fill: #1B4A2E; }
.t3w { font-size: 12px; fill: #A15C08; }
.t3bad { font-size: 12px; fill: #A32A1C; }
.t4 { font-size: 11px; fill: var(--faint); }
.t4c { font-size: 11px; fill: #3F7A57; }
.t4w { font-size: 11px; fill: #A15C08; }

.cap {
  font-size: 9.1pt; line-height: 1.44; color: var(--dim);
  border-left: 2.5pt solid var(--accent); background: var(--tint);
  padding: 2.4mm 3.2mm; border-radius: 0 2mm 2mm 0; margin: 0 0 2mm;
}
.cap strong { color: var(--ink); }
.say {
  font-size: 9.3pt; line-height: 1.44; color: #22402F;
  border-left: 2.5pt solid #B7D9C3; background: #FBFDFC;
  padding: 2.2mm 3.2mm; border-radius: 0 2mm 2mm 0; margin: 0 0 1.6mm;
}
.say em { color: var(--deep); }
.say__k {
  display: inline-block; font-size: 7pt; font-weight: 800; letter-spacing: 1.2pt;
  text-transform: uppercase; color: var(--accent); margin-right: 2.5mm;
}
.legend { display: flex; gap: 6mm; font-size: 8pt; color: var(--faint); margin-top: 1mm; }
.legend span { display: flex; align-items: center; gap: 1.5mm; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1.2px solid; }
.sw--ink { background: #fff; border-color: #B9D2C4; }
.sw--acc { background: var(--tint2); border-color: var(--accent); }
.sw--warn { background: #FDF6E8; border-color: #D8A64B; }
.sw--mut { background: var(--tint); border-color: var(--line); }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7mm; margin-bottom: 3mm; }
.g2 h3 { font-size: 11pt; margin: 0 0 1.6mm; color: var(--deep); }
ul { margin: 0; padding-left: 4.5mm; }
li { margin-bottom: 1.2mm; font-size: 9.4pt; color: var(--dim); }

.toc { margin-top: 2mm; border-top: 1pt solid var(--line); padding-top: 2.5mm; }
.toc-row { display: flex; align-items: baseline; gap: 2mm; text-decoration: none; color: var(--ink);
           font-size: 10pt; padding: 1.2mm 0; border-bottom: 0.5pt dotted #E4EDE7; }
.toc-row .dots { flex: 1; border-bottom: 0.5pt dotted #C9D9CE; transform: translateY(-1.2mm); }
.toc-row .pr { color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; }

/* cover */
.cvmast { display: flex; align-items: center; justify-content: space-between;
          background: linear-gradient(120deg, #14382A, #1E5A3B 60%, #2A7449);
          border-radius: 2.5mm; padding: 6mm 8mm; margin-bottom: 8mm; }
.cvmast__word { font-size: 19pt; font-weight: 800; letter-spacing: 4pt; color: #EAF3EC; line-height: 1; }
.cvmast__sub { font-size: 8.4pt; letter-spacing: 1.4pt; color: #A9D2BC; margin-top: 3mm; text-transform: uppercase; }
.cvtitle { font-size: 30pt; line-height: 1.1; margin: 0 0 5mm; font-weight: 700; letter-spacing: -1pt; }
.cvacc { color: var(--accent); }
.cvsub { font-size: 11.5pt; line-height: 1.5; color: var(--dim); max-width: 215mm; margin: 0 0 8mm; }
.cvmeta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; border-top: 1pt solid var(--line); padding-top: 4mm; }
.cvmeta span { display: block; font-size: 7.4pt; text-transform: uppercase; letter-spacing: 1.2pt; color: var(--faint); font-weight: 700; }
.cvmeta strong { display: block; font-size: 10pt; margin-top: 1mm; }
.cvinside { margin-top: 7mm; border-top: 1pt solid var(--line); padding-top: 4mm; }
.cvinside__h { font-size: 7.4pt; text-transform: uppercase; letter-spacing: 1.4pt; color: var(--faint); font-weight: 800; margin-bottom: 2.5mm; }
.cvinside__row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5mm; }
.cvinside__row b { display: block; font-size: 9.6pt; color: var(--deep); margin-bottom: 1mm; }
.cvinside__row span { display: block; font-size: 8.6pt; color: var(--dim); line-height: 1.42; }
.cvtail { margin-top: 6mm; font-size: 13pt; font-weight: 700; letter-spacing: 0.6pt; color: var(--accent); }

.dg { width: 100%; height: auto; display: block; }
svg { background: #FFFFFF; }
text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style><rect x="0" y="0" width="1000" height="486" fill="#FFFFFF"/>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
    <path d="M0,0 L0,6.4 L7,3.2 z" fill="#5E7D68"/>
  </marker>
  <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
    <path d="M0,0 L0,6.4 L7,3.2 z" fill="#96650C"/>
  </marker>
</defs>
<rect x="20" y="14" width="145" height="28" rx="6" class="bx bx--ink"/><text x="92" y="33" class="t3c" text-anchor="middle">Client</text><rect x="20" y="50" width="145" height="66" rx="8" class="bx bx--mut"/><text x="30" y="74" class="t2" text-anchor="start">1.  Proposal</text><text x="30" y="92" class="t4" text-anchor="start">The client sends</text><text x="30" y="106" class="t4" text-anchor="start">VerifyPlanting</text><text x="22" y="142" class="t4" text-anchor="start">Client = State Forest</text><text x="22" y="155" class="t4" text-anchor="start">Department. Its X.509</text><text x="22" y="168" class="t4" text-anchor="start">identity says which MSP</text><text x="22" y="181" class="t4" text-anchor="start">it belongs to.</text><line x1="165" y1="83" x2="181" y2="83" class="ln" marker-end="url(#ar)"/><rect x="183" y="14" width="145" height="28" rx="6" class="bx bx--ink"/><text x="255" y="33" class="t3c" text-anchor="middle">Gateway</text><rect x="183" y="50" width="145" height="66" rx="8" class="bx bx--acc"/><text x="193" y="74" class="t2" text-anchor="start">2.  Endorsement</text><text x="193" y="92" class="t4" text-anchor="start">Both peers run the</text><text x="193" y="106" class="t4" text-anchor="start">chaincode and sign</text><text x="185" y="142" class="t4" text-anchor="start">Forest Dept and Auditor</text><text x="185" y="155" class="t4" text-anchor="start">each produce a read set,</text><text x="185" y="168" class="t4" text-anchor="start">a write set and a</text><text x="185" y="181" class="t4" text-anchor="start">signature.</text><line x1="328" y1="83" x2="344" y2="83" class="ln" marker-end="url(#ar)"/><rect x="346" y="14" width="145" height="28" rx="6" class="bx bx--ink"/><text x="418" y="33" class="t3c" text-anchor="middle">Orderer</text><rect x="346" y="50" width="145" height="66" rx="8" class="bx bx--warn"/><text x="356" y="74" class="t2" text-anchor="start">3.  Ordering</text><text x="356" y="92" class="t4" text-anchor="start">The orderer batches</text><text x="356" y="106" class="t4" text-anchor="start">the endorsed tx</text><text x="348" y="142" class="t4" text-anchor="start">The orderer sequences</text><text x="348" y="155" class="t4" text-anchor="start">the two signed responses</text><text x="348" y="168" class="t4" text-anchor="start">into the next block.</text><line x1="491" y1="83" x2="507" y2="83" class="ln" marker-end="url(#ar)"/><rect x="509" y="14" width="145" height="28" rx="6" class="bx bx--ink"/><text x="581" y="33" class="t3c" text-anchor="middle">All peers</text><rect x="509" y="50" width="145" height="66" rx="8" class="bx bx--acc"/><text x="519" y="74" class="t2" text-anchor="start">4.  Validation</text><text x="519" y="92" class="t4" text-anchor="start">Every peer checks the</text><text x="519" y="106" class="t4" text-anchor="start">policy and read-set</text><text x="511" y="142" class="t4" text-anchor="start">Two valid endorsements?</text><text x="511" y="155" class="t4" text-anchor="start">Two DISTINCT</text><text x="511" y="168" class="t4" text-anchor="start">organisations? Is the</text><text x="511" y="181" class="t4" text-anchor="start">read-set still current?</text><line x1="654" y1="83" x2="670" y2="83" class="ln" marker-end="url(#ar)"/><rect x="672" y="14" width="145" height="28" rx="6" class="bx bx--ink"/><text x="744" y="33" class="t3c" text-anchor="middle">All peers</text><rect x="672" y="50" width="145" height="66" rx="8" class="bx bx--ink"/><text x="682" y="74" class="t2" text-anchor="start">5.  Commit</text><text x="682" y="92" class="t4" text-anchor="start">Block appended,</text><text x="682" y="106" class="t4" text-anchor="start">state updated</text><text x="674" y="142" class="t4" text-anchor="start">Status flips PENDING to</text><text x="674" y="155" class="t4" text-anchor="start">VERIFIED. The</text><text x="674" y="168" class="t4" text-anchor="start">endorsements become</text><text x="674" y="181" class="t4" text-anchor="start">permanent.</text><line x1="817" y1="83" x2="833" y2="83" class="ln" marker-end="url(#ar)"/><rect x="835" y="14" width="145" height="28" rx="6" class="bx bx--ink"/><text x="907" y="33" class="t3c" text-anchor="middle">Gateway</text><rect x="835" y="50" width="145" height="66" rx="8" class="bx bx--mut"/><text x="845" y="74" class="t2" text-anchor="start">6.  Notification</text><text x="845" y="92" class="t4" text-anchor="start">The event is</text><text x="845" y="106" class="t4" text-anchor="start">streamed to the client</text><text x="837" y="142" class="t4" text-anchor="start">That stream is the 'Live</text><text x="837" y="155" class="t4" text-anchor="start">chaincode events' panel</text><text x="837" y="168" class="t4" text-anchor="start">on the dashboard.</text><rect x="20" y="236" width="960" height="152" rx="10" class="bx bx--chan"/><text x="40" y="260" class="t1" text-anchor="start">Where GreenToken's VerifyPlanting actually lands</text><text x="40" y="286" class="t3" text-anchor="start">1 Proposal</text><text x="40" y="301" class="t4" text-anchor="start">Client = Forest Dept. Payload = tokenId +</text><text x="40" y="314" class="t4" text-anchor="start">verdict + note.</text><text x="360" y="286" class="t3" text-anchor="start">2 Endorsement</text><text x="360" y="301" class="t4" text-anchor="start">ForestDeptMSP and AuditorMSP each run the</text><text x="360" y="314" class="t4" text-anchor="start">chaincode and sign.</text><text x="680" y="286" class="t3" text-anchor="start">3 Ordering</text><text x="680" y="301" class="t4" text-anchor="start">The orderer sequences the two signed</text><text x="680" y="314" class="t4" text-anchor="start">responses. It never looks inside.</text><text x="40" y="352" class="t3" text-anchor="start">4 Validation</text><text x="40" y="367" class="t4" text-anchor="start">Two endorsements? Two distinct orgs? Is the</text><text x="40" y="380" class="t4" text-anchor="start">read-set still current?</text><text x="360" y="352" class="t3" text-anchor="start">5 Commit</text><text x="360" y="367" class="t4" text-anchor="start">PENDING to VERIFIED. The endorsement</text><text x="360" y="380" class="t4" text-anchor="start">signatures are now permanent.</text><text x="680" y="352" class="t3" text-anchor="start">6 Notification</text><text x="680" y="367" class="t4" text-anchor="start">The chaincode event reaches the client — the</text><text x="680" y="380" class="t4" text-anchor="start">dashboard's event feed.</text><rect x="20" y="398" width="960" height="78" rx="10" class="bx bx--ink"/><text x="40" y="422" class="t2" text-anchor="start">The one thing to remember about this diagram</text><text x="40" y="442" class="t3" text-anchor="start">The contract executes at phase 2, not phase 5. By the time a transaction is committed, the business logic has already run and the peers are only</text><text x="40" y="457" class="t3" text-anchor="start">checking that the right organisations agreed and that nothing changed underneath. That is exactly why Fabric chaincode must be deterministic.</text></svg>