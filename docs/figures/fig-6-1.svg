<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" width="1000" height="435"><style>
@page { size: A4 landscape; margin: 13mm 13mm 12mm 13mm; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

:root {
  --paper: #FFFFFF;
  --tint: #F4F8F5;
  --tint2: #E6F4EC;
  --line: #DCE8E0;
  --ink: #12211A;
  --dim: #48654F;
  --faint: #75897D;
  --accent: #1E8E4E;
  --deep: #14663A;
  --warn: #96650C;
  --danger: #C0392B;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

html, body { margin: 0; padding: 0; }
body { font-family: var(--sans); font-size: 10pt; line-height: 1.5; color: var(--ink); background: var(--paper); }

@media screen {
  html { background: #d5d5d5; }
  body { padding: 18px 0; }
  body > section { width: 297mm; min-height: 210mm; margin: 0 auto 18px; background: #fff;
                   box-shadow: 0 4px 24px rgba(0,0,0,.18); padding: 13mm; overflow: hidden; }
}

.page { break-after: page; }
.page:last-child { break-after: auto; }
.cover { break-after: page; }

h2 { font-size: 15pt; margin: 0 0 1.5mm; letter-spacing: -0.4pt; font-weight: 700; }
p { margin: 0 0 2mm; }
p.lead { font-size: 10.5pt; color: var(--dim); line-height: 1.5; margin-bottom: 3mm; }
em { font-style: italic; }
strong { font-weight: 700; }
.mono { font-family: var(--mono); font-size: 0.94em; }

.dg { width: 100%; height: 118mm; display: block; margin: 1mm 0 2.5mm; }
.dg .bx { stroke-width: 1.4; }
.bx--ink  { fill: #FFFFFF; stroke: #B9D2C4; }
.bx--acc  { fill: var(--tint2); stroke: var(--accent); }
.bx--mut  { fill: var(--tint); stroke: var(--line); }
.bx--warn { fill: #FDF6E8; stroke: #D8A64B; }
.bx--bad  { fill: #FDECEA; stroke: #C0392B; }
.bx--chan { fill: #F1F8F4; stroke: #B9D2C4; stroke-dasharray: 5 3; }
.dg .ln { stroke: #5E7D68; stroke-width: 1.6; fill: none; }
.dg .lnacc { stroke: #1E8E4E; stroke-width: 1.8; fill: none; }
.dg .lnbad { stroke: #C0392B; stroke-width: 1.8; fill: none; }
.dg text { font-family: var(--sans); }
.t1 { font-size: 15px; font-weight: 700; fill: var(--ink); }
.t2 { font-size: 13px; font-weight: 600; fill: var(--ink); }
.t3 { font-size: 12px; fill: var(--dim); }
.t3c { font-size: 12px; fill: #1B4A2E; }
.t3w { font-size: 12px; fill: #A15C08; }
.t3bad { font-size: 12px; fill: #A32A1C; }
.t4 { font-size: 11px; fill: var(--faint); }
.t4c { font-size: 11px; fill: #3F7A57; }
.t4w { font-size: 11px; fill: #A15C08; }

.cap {
  font-size: 9.1pt; line-height: 1.44; color: var(--dim);
  border-left: 2.5pt solid var(--accent); background: var(--tint);
  padding: 2.4mm 3.2mm; border-radius: 0 2mm 2mm 0; margin: 0 0 2mm;
}
.cap strong { color: var(--ink); }
.say {
  font-size: 9.3pt; line-height: 1.44; color: #22402F;
  border-left: 2.5pt solid #B7D9C3; background: #FBFDFC;
  padding: 2.2mm 3.2mm; border-radius: 0 2mm 2mm 0; margin: 0 0 1.6mm;
}
.say em { color: var(--deep); }
.say__k {
  display: inline-block; font-size: 7pt; font-weight: 800; letter-spacing: 1.2pt;
  text-transform: uppercase; color: var(--accent); margin-right: 2.5mm;
}
.legend { display: flex; gap: 6mm; font-size: 8pt; color: var(--faint); margin-top: 1mm; }
.legend span { display: flex; align-items: center; gap: 1.5mm; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1.2px solid; }
.sw--ink { background: #fff; border-color: #B9D2C4; }
.sw--acc { background: var(--tint2); border-color: var(--accent); }
.sw--warn { background: #FDF6E8; border-color: #D8A64B; }
.sw--mut { background: var(--tint); border-color: var(--line); }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7mm; margin-bottom: 3mm; }
.g2 h3 { font-size: 11pt; margin: 0 0 1.6mm; color: var(--deep); }
ul { margin: 0; padding-left: 4.5mm; }
li { margin-bottom: 1.2mm; font-size: 9.4pt; color: var(--dim); }

.toc { margin-top: 2mm; border-top: 1pt solid var(--line); padding-top: 2.5mm; }
.toc-row { display: flex; align-items: baseline; gap: 2mm; text-decoration: none; color: var(--ink);
           font-size: 10pt; padding: 1.2mm 0; border-bottom: 0.5pt dotted #E4EDE7; }
.toc-row .dots { flex: 1; border-bottom: 0.5pt dotted #C9D9CE; transform: translateY(-1.2mm); }
.toc-row .pr { color: var(--faint); font-weight: 700; font-variant-numeric: tabular-nums; }

/* cover */
.cvmast { display: flex; align-items: center; justify-content: space-between;
          background: linear-gradient(120deg, #14382A, #1E5A3B 60%, #2A7449);
          border-radius: 2.5mm; padding: 6mm 8mm; margin-bottom: 8mm; }
.cvmast__word { font-size: 19pt; font-weight: 800; letter-spacing: 4pt; color: #EAF3EC; line-height: 1; }
.cvmast__sub { font-size: 8.4pt; letter-spacing: 1.4pt; color: #A9D2BC; margin-top: 3mm; text-transform: uppercase; }
.cvtitle { font-size: 30pt; line-height: 1.1; margin: 0 0 5mm; font-weight: 700; letter-spacing: -1pt; }
.cvacc { color: var(--accent); }
.cvsub { font-size: 11.5pt; line-height: 1.5; color: var(--dim); max-width: 215mm; margin: 0 0 8mm; }
.cvmeta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; border-top: 1pt solid var(--line); padding-top: 4mm; }
.cvmeta span { display: block; font-size: 7.4pt; text-transform: uppercase; letter-spacing: 1.2pt; color: var(--faint); font-weight: 700; }
.cvmeta strong { display: block; font-size: 10pt; margin-top: 1mm; }
.cvinside { margin-top: 7mm; border-top: 1pt solid var(--line); padding-top: 4mm; }
.cvinside__h { font-size: 7.4pt; text-transform: uppercase; letter-spacing: 1.4pt; color: var(--faint); font-weight: 800; margin-bottom: 2.5mm; }
.cvinside__row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5mm; }
.cvinside__row b { display: block; font-size: 9.6pt; color: var(--deep); margin-bottom: 1mm; }
.cvinside__row span { display: block; font-size: 8.6pt; color: var(--dim); line-height: 1.42; }
.cvtail { margin-top: 6mm; font-size: 13pt; font-weight: 700; letter-spacing: 0.6pt; color: var(--accent); }

.dg { width: 100%; height: auto; display: block; }
svg { background: #FFFFFF; }
text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
</style><rect x="0" y="0" width="1000" height="435" fill="#FFFFFF"/>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
    <path d="M0,0 L0,6.4 L7,3.2 z" fill="#5E7D68"/>
  </marker>
  <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
    <path d="M0,0 L0,6.4 L7,3.2 z" fill="#96650C"/>
  </marker>
</defs>
<rect x="30" y="30" width="150" height="92" rx="8" class="bx bx--ink"/><text x="105" y="58" class="t1" text-anchor="middle">Client application</text><text x="105" y="78" class="t3" text-anchor="middle">React SPA / SDK</text><text x="105" y="96" class="t4" text-anchor="middle">asks, never writes directly</text><rect x="240" y="22" width="250" height="108" rx="8" class="bx bx--acc"/><text x="365" y="46" class="t1" text-anchor="middle">Fabric Gateway  (v2.5)</text><text x="365" y="66" class="t3" text-anchor="middle">Evaluate · Endorse · Submit</text><text x="365" y="84" class="t3" text-anchor="middle">commit-status · events</text><text x="365" y="108" class="t4" text-anchor="middle">one call the client makes</text><rect x="560" y="22" width="190" height="108" rx="8" class="bx bx--warn"/><text x="655" y="46" class="t1" text-anchor="middle">Ordering service</text><text x="655" y="66" class="t1" text-anchor="middle">orders blocks</text><text x="655" y="84" class="t3" text-anchor="middle">does NOT check</text><text x="655" y="100" class="t3" text-anchor="middle">business rules</text><rect x="820" y="22" width="150" height="108" rx="8" class="bx bx--mut"/><text x="895" y="46" class="t1" text-anchor="middle">MSP</text><text x="895" y="66" class="t3" text-anchor="middle">identity directory</text><text x="895" y="84" class="t3" text-anchor="middle">X.509 certs</text><text x="895" y="100" class="t3" text-anchor="middle">one per org</text><rect x="30" y="168" width="940" height="250" rx="14" class="bx bx--chan"/><text x="50" y="194" class="t1" text-anchor="start">CHANNEL   greentoken-channel</text><text x="950" y="194" class="t3" text-anchor="end">private ledger + private orderer</text><rect x="50" y="212" width="210" height="176" rx="10" class="bx bx--ink"/><text x="155" y="234" class="t2" text-anchor="middle">Planters Association</text><text x="155" y="252" class="t4" text-anchor="middle">PlantersAssociationMSP</text><rect x="64" y="264" width="182" height="52" rx="6" class="bx bx--acc"/><text x="155" y="284" class="t3c" text-anchor="middle">peer</text><text x="155" y="302" class="t4c" text-anchor="middle">ledger + world state</text><rect x="64" y="322" width="182" height="52" rx="6" class="bx bx--acc"/><text x="155" y="342" class="t3c" text-anchor="middle">chaincode container</text><text x="155" y="360" class="t4c" text-anchor="middle">PlantTree</text><rect x="280" y="212" width="210" height="176" rx="10" class="bx bx--ink"/><text x="385" y="234" class="t2" text-anchor="middle">State Forest Department</text><text x="385" y="252" class="t4" text-anchor="middle">ForestDeptMSP</text><rect x="294" y="264" width="182" height="52" rx="6" class="bx bx--acc"/><text x="385" y="284" class="t3c" text-anchor="middle">peer</text><text x="385" y="302" class="t4c" text-anchor="middle">ledger + world state</text><rect x="294" y="322" width="182" height="52" rx="6" class="bx bx--acc"/><text x="385" y="342" class="t3c" text-anchor="middle">chaincode container</text><text x="385" y="360" class="t4c" text-anchor="middle">VerifyPlanting</text><rect x="510" y="212" width="210" height="176" rx="10" class="bx bx--ink"/><text x="615" y="234" class="t2" text-anchor="middle">Independent Auditor</text><text x="615" y="252" class="t4" text-anchor="middle">AuditorMSP</text><rect x="524" y="264" width="182" height="52" rx="6" class="bx bx--acc"/><text x="615" y="284" class="t3c" text-anchor="middle">peer</text><text x="615" y="302" class="t4c" text-anchor="middle">ledger + world state</text><rect x="524" y="322" width="182" height="52" rx="6" class="bx bx--acc"/><text x="615" y="342" class="t3c" text-anchor="middle">chaincode container</text><text x="615" y="360" class="t4c" text-anchor="middle">VerifyPlanting</text><rect x="740" y="212" width="210" height="176" rx="10" class="bx bx--ink"/><text x="845" y="234" class="t2" text-anchor="middle">Corporate Green Funders</text><text x="845" y="252" class="t4" text-anchor="middle">CorporateFundersMSP</text><rect x="754" y="264" width="182" height="52" rx="6" class="bx bx--acc"/><text x="845" y="284" class="t3c" text-anchor="middle">peer</text><text x="845" y="302" class="t4c" text-anchor="middle">ledger + world state</text><rect x="754" y="322" width="182" height="52" rx="6" class="bx bx--acc"/><text x="845" y="342" class="t3c" text-anchor="middle">chaincode container</text><text x="845" y="360" class="t4c" text-anchor="middle">FundTokens</text><line x1="180" y1="76" x2="238" y2="76" class="ln" marker-end="url(#ar)"/><line x1="490" y1="76" x2="558" y2="76" class="ln" marker-end="url(#ar)"/><path d="M655 132 V156 H365 V132" class="ln" marker-end="url(#ar)"/><path d="M895 132 V156" class="ln" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="895" y="168" class="t4" text-anchor="middle">identities</text><line x1="260" y1="300" x2="278" y2="300" class="ln" marker-end="url(#ar)"/><line x1="490" y1="300" x2="508" y2="300" class="ln" marker-end="url(#ar)"/><line x1="720" y1="300" x2="738" y2="300" class="ln" marker-end="url(#ar)"/><text x="490" y="400" class="t4" text-anchor="middle">peers gossip blocks to each other — each keeps its own full copy</text></svg>